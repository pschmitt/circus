name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            clippy: --all-targets
            test: >-
              cargo nextest run --all &&
              cargo nextest run --all -E 'binary_id(circus-evaluator::eval_tests)' --run-ignored ignored-only
          - platform: macOS
            os: macos-latest
            clippy: -p circus-agent --all-targets
            test: cargo nextest run -p circus-agent
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@cbe0792d849aef0dbad4d2bde960b110761ed905 # v2.1.1
    with:
      os: ${{ matrix.os }}
      flake-check: false
      fmt: ${{ matrix.platform == 'Linux' }}
      fmt-command: cargo fmt --check
      clippy: true
      clippy-command: cargo clippy ${{ matrix.clippy }} -- -D warnings
      test: true
      test-command: ${{ matrix.test }}

  # Circus runs formatting, codegen, dependency policy, Linux packages and VM checks.
  deny:
    name: Dependency Audit
    uses: manic-systems/workflows/.github/workflows/rust-audit.yml@cbe0792d849aef0dbad4d2bde960b110761ed905 # v2.1.1
    with:
      arguments: ""
      command-arguments: advisories

  agent-macos:
    name: Build Agent Package (macOS)
    # Circus has no Darwin builders; retain this packaging check on demand.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@cbe0792d849aef0dbad4d2bde960b110761ed905 # v2.1.1
    with:
      os: macos-latest
      flake-check: false
      build: true
      build-command: nix build .#packages.aarch64-darwin.circus-agent -L --no-link

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@cbe0792d849aef0dbad4d2bde960b110761ed905 # v2.1.1

  required:
    name: Required Checks
    if: always()
    needs:
      - checks
      - deny
      - agent-macos
      - actions
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
