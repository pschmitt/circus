name: Tag and Release

on:
  workflow_dispatch:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  status:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check Circus and GitHub CI
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha) || (github.event_name == 'status' && (github.event.context == 'circus/jobset/main' || github.event.context == 'circus/jobset/main-arm' || github.event.context == 'circus/artifacts') && github.event.state == 'success' && github.event.sha == github.sha) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      statuses: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release gate
        run: python3 -m unittest discover -s .github/scripts -p test_circus_release_gate.py
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: bash .github/scripts/circus-release-gate.sh

  prepare:
    name: Prepare Release
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: gate
    if: ${{ needs.gate.outputs.ready == 'true' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@cbe0792d849aef0dbad4d2bde960b110761ed905 # v2.1.1
    with:
      # The reusable workflow marks semver tags with suffixes as prereleases.
      # While the workspace version is `*-dev`, releases are intentionally
      # published as GitHub prereleases.
      stage: prepare
      install-nix: false
      version-command: python3 .github/scripts/workspace-version.py

  build:
    name: Assemble ${{ matrix.arch }} release assets
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            arch: amd64
          - system: aarch64-linux
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pschmitt/ci-workflows/.github/actions/nix-niks3@main
        with:
          s3-store: ${{ secrets.NIKS3_S3_STORE }}
          s3-access-key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
      - name: Collect Circus-built binaries
        env:
          SYSTEM: ${{ matrix.system }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in server:circus-server:circus-server evaluator:circus-evaluator:circus-evaluator \
            queue-runner:circus-queue-runner:circus-queue-runner agent:circus-agent:circus-agent \
            ctl:circus-cli:circusctl
          do
            IFS=: read -r suffix package binary <<< "$spec"
            output="$RUNNER_TEMP/$package"
            nix --option max-jobs 0 --option builders '' --option fallback false \
              --option allow-import-from-derivation false build -L \
              ".#packages.$SYSTEM.$package" --out-link "$output"
            install -m 0755 "$output/bin/$binary" "circus-$suffix-linux-$ARCH"
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: circus-*-linux-${{ matrix.arch }}
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: gh release upload "$RELEASE_TAG" circus-*-linux-"$ARCH" --clobber

  finalize:
    name: Finalize Release
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.build.result == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@cbe0792d849aef0dbad4d2bde960b110761ed905 # v2.1.1
    with:
      stage: finalize
      version: ${{ needs.prepare.outputs.version }}
      asset-prefix: circus
